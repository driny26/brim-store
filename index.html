<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRIM. — Headwear</title>
<style>
:root{--ink:#111;--paper:#fff;--muted:#777;--line:#e8e8e8;--soft:#f6f6f4}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}
.topbar{height:38px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:2px}
header{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 6vw;position:sticky;top:0;background:#fff;z-index:5}
.brand{display:flex;align-items:center;min-width:105px}.brand img{display:block;width:112px;height:58px;object-fit:contain;object-position:left center}.brand small{display:none}
.nav{display:flex;align-items:center;gap:24px}.nav button{border:0;background:none;font-size:11px;letter-spacing:1.2px;text-transform:uppercase}.cartbtn{border:1px solid #111;padding:11px 15px}
.hero{padding:68px 6vw 54px;background:#f5f5f3;display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center}
.kicker{font-size:10px;letter-spacing:3px;color:#777}.hero h1{font-size:clamp(42px,6vw,78px);letter-spacing:-4px;line-height:.95;margin:18px 0}.hero p{font-size:14px;color:#666;line-height:1.8;max-width:370px}.cta{background:#111;color:#fff;border:1px solid #111;padding:15px 23px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-top:16px}
.hero-art{height:350px;background:#e7e7e3;display:flex;align-items:center;justify-content:center;overflow:hidden}.hero-art img{width:100%;height:100%;object-fit:cover}
.section{padding:64px 6vw}.sectionhead{display:flex;align-items:end;justify-content:space-between;margin-bottom:28px}.section h2{font-size:30px;letter-spacing:-1.5px;margin:8px 0 0}.count{font-size:11px;color:#777}
.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:24px}.category-card{border:1px solid var(--line);background:#f6f6f4;padding:0;text-align:left;overflow:hidden}.category-collage{height:260px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;background:#fff}.category-collage img{width:100%;height:100%;object-fit:cover}.category-collage .placeholder{display:flex;align-items:center;justify-content:center;background:#e9e9e5;color:#999;font-size:10px;letter-spacing:2px}.category-info{padding:18px}.category-info h3{margin:0 0 6px;font-size:18px}.category-info p{margin:0;color:#777;font-size:11px;line-height:1.6}.subcats{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}.subcats button{padding:10px 13px;border:1px solid #ddd;background:#fff;font-size:10px;letter-spacing:.7px;text-transform:uppercase}.subcats button.active{background:#111;color:#fff}.backlink{border:0;background:none;padding:0;margin:0 0 18px;text-decoration:underline;font-size:11px}.customizer{display:grid;grid-template-columns:1fr 1fr;gap:24px}.method-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.method-option{border:1px solid #ddd;padding:8px;background:#fff;text-align:center;font-size:10px}.method-option.active{border:2px solid #111}.method-option svg{width:100%;height:82px;display:block}.letter-preview{background:#f5f5f3;padding:20px;text-align:center;min-height:90px;display:flex;align-items:center;justify-content:center;font-size:28px;overflow-wrap:anywhere}.admin-preview{width:150px;max-width:100%;background:#f5f5f3;display:block;margin-top:8px}.custom-summary{font-size:11px;color:#666;line-height:1.6;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 18px}.product{min-width:0}.photo{height:310px;background:#f3f3f1;position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo img{cursor:zoom-in}.image-preview{display:block;width:100%;max-height:76vh;object-fit:contain;background:#f5f5f3}.photo .placeholder{height:100%;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px;letter-spacing:2px}.product h3{font-size:14px;margin:15px 0 6px;font-weight:600}.price{font-size:13px;color:#555}.productrow{display:flex;justify-content:space-between;align-items:center}.add{background:#111;color:#fff;border:0;padding:10px 13px;font-size:10px;letter-spacing:1px}
footer{background:#111;color:#fff;padding:40px 6vw;display:flex;justify-content:space-between;align-items:center}.footnote{font-size:10px;letter-spacing:1.5px;color:#aaa}
.overlay{position:fixed;inset:0;background:#0008;z-index:20;display:none;align-items:center;justify-content:center;padding:16px}.panel{background:#fff;width:min(560px,100%);max-height:90vh;overflow:auto;padding:28px}.panel.wide{width:min(900px,100%)}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.panel h2{margin:0;font-size:23px;letter-spacing:-1px}.x{border:0;background:none;font-size:24px}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#666}.field input,.field textarea{width:100%;border:1px solid #ddd;padding:13px;background:#fff;outline:none}.field textarea{min-height:78px;resize:vertical}.uploadhint{font-size:11px;color:#777;margin-top:5px}.previewimg{width:100%;max-height:180px;object-fit:contain;background:#f4f4f2;margin-top:8px;display:none}.full{width:100%;background:#111;color:#fff;border:0;padding:15px;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;margin-top:12px}.subtle{font-size:12px;color:#777;line-height:1.6}.cartline,.orderline{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:14px 0;font-size:13px}.qty{display:flex;align-items:center;gap:10px}.qty button{border:1px solid #ddd;background:#fff;width:25px;height:25px}.tabs{display:flex;gap:8px;margin:15px 0 20px}.tabs button{padding:10px 14px;border:1px solid #ddd;background:#fff;font-size:11px}.tabs button.active{background:#111;color:#fff;border-color:#111}.adminrow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.adminrow img{width:64px;height:64px;object-fit:cover;background:#eee}.mini{border:1px solid #ddd;background:#fff;padding:7px 9px;font-size:10px}.empty{padding:30px 0;color:#888;text-align:center;font-size:13px}.status{font-size:10px;background:#f1f1ef;padding:5px 8px}
@media(max-width:700px){.category-grid{grid-template-columns:1fr}.category-collage{height:220px}.customizer{grid-template-columns:1fr}.method-grid{grid-template-columns:repeat(3,1fr)}header{padding:0 5vw;height:68px}.brand img{width:96px;height:52px}.nav{gap:10px}.nav button{font-size:9px}.hero{grid-template-columns:1fr;padding:45px 5vw 35px;gap:24px}.hero-art{height:250px}.section{padding:48px 5vw}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}.photo{height:220px}.section h2{font-size:25px}footer{padding:30px 5vw;display:block}.footnote{margin-top:15px}.panel{padding:20px}.adminrow{grid-template-columns:48px 1fr auto}.adminrow img{width:48px;height:48px}}
</style></head>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="panel" id="panel"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://qedcawzqzgoidadpiqbl.supabase.co';
const SUPABASE_KEY='sb_publishable_rTLPmLAofQoWQc2r6HuFVg_YUCatU_e';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const CART='brim_cart_v1'; let productCache=[]; let currentUser=null;
function readCart(){try{return JSON.parse(localStorage.getItem(CART))||[]}catch{return []}}
function saveCart(v){localStorage.setItem(CART,JSON.stringify(v))}
function cart(){return readCart()}
function money(n){return Number(n||0).toLocaleString('en-US')+' EGP'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function scrollToShop(){document.getElementById('shop').scrollIntoView({behavior:'smooth'})}
async function loadProducts(){
 const {data,error}=await sb.from('products').select('id,name,description,price,image_url,active,created_at,product_group,cap_type').eq('active',true).order('created_at',{ascending:false});
 if(error){console.error(error);document.getElementById('products').innerHTML='<div class="empty">Could not load products. Please refresh the page.</div>';return}
 productCache=data||[];render();
}
function products(){return productCache}
const CAP_TYPES=['docker hat','washed cotton','baseball','trucker','bucket hat','waterproof cap'];
function capLabel(s){return ({'docker hat':'Docker Hat','washed cotton':'Washed Cotton','baseball':'Baseball','trucker':'Trucker','bucket hat':'Bucket Hat','waterproof cap':'Waterproof Cap'})[s]||s}
function categoryProducts(group){return products().filter(p=>p.product_group===group)}
function collage(group){const list=categoryProducts(group).slice(0,4);return Array.from({length:4},(_,i)=>list[i]?.image_url?'<img src="'+esc(list[i].image_url)+'" alt="">':'<div class="placeholder">BRIM.</div>').join('')}
function render(){
 const ps=products(),count=document.getElementById('productCount');if(count)count.textContent=ps.length+' PRODUCTS';
 const cat=document.getElementById('catalog'),target=document.getElementById('products');
 if(cat){
  if(!window.activeCatalog||activeCatalog==='all'){
   cat.innerHTML='<div class="category-grid"><button class="category-card" onclick="showCatalog(\'designed\')"><div class="category-collage">'+collage('designed')+'</div><div class="category-info"><h3>Designed Caps</h3><p>Explore our ready-made designs across six cap styles.</p></div></button><button class="category-card" onclick="showCatalog(\'plain\')"><div class="category-collage">'+collage('plain')+'</div><div class="category-info"><h3>Plain Caps</h3><p>Choose a blank cap and make it yours.</p></div></button><button class="category-card" style="grid-column:1/-1" onclick="openCustomizer()"><div class="category-info"><h3>Customize Your Cap ↗</h3><p>Pick a design, choose your cap and select how it is applied.</p></div></button></div>';
   if(target)target.innerHTML='';
  }else{
   const group=activeCatalog,filtered=ps.filter(p=>p.product_group===group&&(activeCapType==='all'||p.cap_type===activeCapType));
   cat.innerHTML='<button class="backlink" onclick="showCatalog(\'all\')">← ALL CATEGORIES</button><div class="sectionhead"><h2 style="font-size:24px">'+(group==='designed'?'Designed Caps':'Plain Caps')+'</h2></div><div class="subcats">'+['all',...CAP_TYPES].map(t=>'<button class="'+(activeCapType===t?'active':'')+'" onclick="filterCap(\''+t+'\')">'+(t==='all'?'All styles':capLabel(t))+'</button>').join('')+'</div>';
   if(target)target.innerHTML=filtered.length?'<div class="grid">'+filtered.map(p=>'<article class="product"><div class="photo">'+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'" onclick="openProductImage(this.src)">':'<div class="placeholder">BRIM.</div>')+'</div><h3>'+esc(p.name)+'</h3>'+(p.description?'<p class="subtle">'+esc(p.description)+'</p>':'')+'<div class="productrow"><span class="price">'+money(p.price)+'</span><button class="add" onclick="addCart(\''+p.id+'\')">ADD TO BAG</button></div></article>').join('')+'</div>':'<div class="empty">No products in this style yet.</div>';
  }
 }
 const cartCount=document.getElementById('cartCount');if(cartCount)cartCount.textContent=cart().reduce((a,b)=>a+b.qty,0);
}
let activeCatalog='all',activeCapType='all';
function showCatalog(group){activeCatalog=group;activeCapType='all';render()}
function filterCap(type){activeCapType=type;render()}
function addCart(id){let c=cart(),p=products().find(x=>x.id===id);if(!p)return;const key=id+'|standard';let line=c.find(x=>x.key===key);if(line)line.qty=Math.min(20,line.qty+1);else c.push({id,qty:1,key});saveCart(c);render();openCart()}
function addCustomCart(){const design=document.getElementById('customDesign')?.value,cap=document.getElementById('customCap')?.value,method=document.querySelector('input[name="printMethod"]:checked')?.value,text=document.getElementById('customText')?.value.trim()||'',font=document.getElementById('customFont')?.value||'Arial';if(!design||!cap||!method){alert('Choose a design, a plain cap and a print method.');return}const key=[cap,design,method,text,font].join('|'),c=cart(),line=c.find(x=>x.key===key);if(line)line.qty=Math.min(20,line.qty+1);else c.push({id:cap,qty:1,key,customization:{custom:true,design_id:design,print_method:method,custom_text:text,font}});saveCart(c);render();openCart()}
function printSample(method){const symbol=method==='embroidery'?'<path d="M43 51h34M48 58h24M53 65h14" stroke="#111" stroke-width="3" stroke-linecap="round"/><path d="M60 42v31" stroke="#111" stroke-width="2" stroke-dasharray="2 3"/>':method==='dtf'?'<rect x="43" y="43" width="34" height="28" rx="3" fill="#fff" stroke="#111" stroke-width="2"/><path d="M49 63l8-12 6 8 5-6 5 10" fill="none" stroke="#111" stroke-width="2"/>':'<rect x="43" y="43" width="34" height="28" rx="5" fill="#ddd" stroke="#111" stroke-width="2"/><path d="M48 48h24v18H48z" fill="none" stroke="#777" stroke-dasharray="2 2"/>';return '<svg viewBox="0 0 120 90" aria-label="'+method+' example"><path d="M17 49c7-23 23-34 43-34s36 11 43 34l-10 8H27z" fill="#222"/><path d="M18 49c-2 15 10 23 42 23s44-8 42-23c-20 7-64 7-84 0z" fill="#333"/><path d="M60 15v57" stroke="#555" opacity=".5"/>'+symbol+'</svg>'}
function letteringSvg(text,font){const safe=esc(text||'Your text');const family=font==='Brush Script MT'?'cursive':font;return '<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260"><rect width="100%" height="100%" fill="#f5f5f3"/><text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle" font-family="'+family+'" font-size="94" fill="#111">'+safe+'</text></svg>'}
function downloadLettering(id,txt,font){const svg=letteringSvg(txt,font),url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})),a=document.createElement('a');a.href=url;a.download='brim-lettering-'+id+'.svg';a.click();URL.revokeObjectURL(url)}
function updateLetterPreview(){const el=document.getElementById('letterPreview'),txt=document.getElementById('customText')?.value||'Your text',font=document.getElementById('customFont')?.value||'Arial';if(el){el.innerHTML=esc(txt||'Your text');el.style.fontFamily=font==='Brush Script MT'?'cursive':font}}
function openCustomizer(){const designs=categoryProducts('designed'),caps=categoryProducts('plain');show('<div class="panelhead"><h2>Customize Your Cap</h2><button class="x" onclick="closeModal()">×</button></div><div class="customizer"><div><div class="field"><label>Choose a design</label><select id="customDesign" style="width:100%;padding:12px;border:1px solid #ddd">'+designs.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></div><div class="field"><label>Choose a plain cap</label><select id="customCap" style="width:100%;padding:12px;border:1px solid #ddd">'+caps.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' — '+money(p.price)+'</option>').join('')+'</select></div><div class="field"><label>How should we apply the design?</label><div class="method-grid">'+[['embroidery','Embroidery'],['dtf','DTF'],['patch','Patch']].map(([v,l])=>'<label class="method-option"><input type="radio" name="printMethod" value="'+v+'" '+(v==='embroidery'?'checked':'')+'><br>'+printSample(v)+'<b>'+l+'</b>'+(v==='embroidery'?'<small> +50 EGP</small>':'')+'</label>').join('')+'</div></div><div class="field"><label>Add a word or name (optional)</label><input id="customText" maxlength="24" placeholder="Write your text" oninput="updateLetterPreview()"></div><div class="field"><label>Choose lettering font</label><select id="customFont" onchange="updateLetterPreview()" style="width:100%;padding:12px;border:1px solid #ddd">'+['Arial','Georgia','Courier New','Times New Roman','Verdana','Brush Script MT'].map(f=>'<option>'+f+'</option>').join('')+'</select></div></div><div><div class="kicker">LETTERING PREVIEW</div><div class="letter-preview" id="letterPreview">Your text</div><p class="custom-summary">Embroidery adds 50 EGP to the plain cap price. DTF and Patch have no extra fee currently.</p><button class="full" onclick="addCustomCart()">ADD CUSTOM CAP TO BAG</button></div></div>',true);if(!designs.length||!caps.length){document.querySelector('.customizer').insertAdjacentHTML('afterbegin','<p class="subtle">Add products and assign them to Designed Caps or Plain Caps in the admin dashboard to enable customization.</p>')}}
function closeModal(){document.getElementById('overlay').style.display='none'}
function openProductImage(url){const img=document.createElement('img');img.className='image-preview';img.src=url;img.alt='Product image';const head=document.createElement('div');head.className='panelhead';head.innerHTML='<h2>Product image</h2><button class="x" onclick="closeModal()">×</button>';show('');const panel=document.getElementById('panel');panel.innerHTML='';panel.appendChild(head);panel.appendChild(img);document.getElementById('overlay').style.display='flex';}
function show(html,wide=false){document.getElementById('panel').className='panel'+(wide?' wide':'');document.getElementById('panel').innerHTML=html;document.getElementById('overlay').style.display='flex'}
function cartLinePrice(x){const p=products().find(y=>y.id===x.id);return p?(p.price+(x.customization?.print_method==='embroidery'?50:0)):0}
function cartLineName(x){const p=products().find(y=>y.id===x.id);if(!p)return '';if(!x.customization)return p.name;const d=products().find(y=>y.id===x.customization.design_id);return p.name+' + '+(d?.name||'Design')+' ('+x.customization.print_method+')'+(x.customization.custom_text?' · '+x.customization.custom_text:'')}
function openCart(){let c=cart(),total=0;let lines=c.map((x,i)=>{let price=cartLinePrice(x);total+=price*x.qty;return '<div class="cartline"><div><b>'+esc(cartLineName(x))+'</b><div class="subtle">'+money(price)+' each</div></div><div class="qty"><button onclick="changeQty('+i+',-1)">−</button>'+x.qty+'<button onclick="changeQty('+i+',1)">+</button></div><b>'+money(price*x.qty)+'</b></div>'}).join('');show('<div class="panelhead"><h2>Your bag</h2><button class="x" onclick="closeModal()">×</button></div>'+(lines||'<div class="empty">Your bag is empty.</div>')+'<div class="cartline"><b>Subtotal</b><b>'+money(total)+'</b></div><p class="subtle">Delivery fees are calculated at checkout.</p><button class="full" '+(c.length?'':'disabled')+' onclick="checkout()">Continue to checkout</button>')}
function changeQty(index,n){let c=cart();if(c[index])c[index].qty=Math.min(20,c[index].qty+n);c=c.filter(y=>y.qty>0);saveCart(c);openCart();render()}
const GOVERNORATES=[['Cairo',60],['Giza',70],['Alexandria',70],['Qalyubia',70],['Beheira',70],['Kafr El Sheikh',70],['Gharbia',70],['Menoufia',70],['Dakahlia',70],['Damietta',70],['Sharqia',70],['Port Said',80],['Ismailia',80],['Suez',80],['Beni Suef',90],['Fayoum',90],['Minya',90],['Assiut',100],['Sohag',100],['Qena',100],['Luxor',100],['Aswan',100],['Matrouh',150],['Red Sea',150],['New Valley',150],['North Sinai',150],['South Sinai',150]];
function shippingFee(){const name=document.querySelector('[name="governorate"]')?.value;return GOVERNORATES.find(x=>x[0]===name)?.[1]||0}
function updateCheckoutTotal(){const fee=shippingFee(),subtotal=Number(document.getElementById('checkoutSubtotal')?.dataset.amount||0),feeEl=document.getElementById('deliveryFee'),totalEl=document.getElementById('checkoutTotal');if(feeEl)feeEl.textContent=money(fee);if(totalEl)totalEl.textContent=money(subtotal+fee)}
function checkout(){let c=cart(),total=c.reduce((s,x)=>s+cartLinePrice(x)*x.qty,0);if(!c.length)return;show('<div class="panelhead"><h2>Complete your order</h2><button class="x" onclick="openCart()">×</button></div><form onsubmit="placeOrder(event)"><div class="field"><label>Full name</label><input name="name" required minlength="2" placeholder="Your first and last name"></div><div class="field"><label>Phone number</label><input name="phone" required type="tel" minlength="6" placeholder="01XXXXXXXXX"></div><div class="field"><label>Government / المحافظة</label><select name="governorate" required onchange="updateCheckoutTotal()" style="width:100%;border:1px solid #ddd;padding:13px;background:#fff"><option value="">Choose your governorate</option>'+GOVERNORATES.map(([name])=>'<option value="'+name+'">'+name+'</option>').join('')+'</select></div><div class="field"><label>Full address</label><textarea name="address" required minlength="5" placeholder="Area, street, building, apartment"></textarea></div><div class="cartline"><span>Products subtotal</span><b id="checkoutSubtotal" data-amount="'+total+'">'+money(total)+'</b></div><div class="cartline"><span>Delivery fee</span><b id="deliveryFee">'+money(0)+'</b></div><div class="cartline"><b>Order total</b><b id="checkoutTotal">'+money(total)+'</b></div><p class="subtle">Delivery fee is calculated automatically according to your governorate.</p><button class="full">CONFIRM ORDER</button></form>')}
async function placeOrder(e){e.preventDefault();const form=e.target,btn=form.querySelector('button.full');btn.disabled=true;btn.textContent='SENDING...';try{let f=new FormData(form),items=cart().map(x=>({product_id:x.id,quantity:x.qty,customization:x.customization||{}}));const {data,error}=await sb.rpc('place_order',{p_customer_name:f.get('name'),p_phone:f.get('phone'),p_address:f.get('address'),p_notes:String(f.get('governorate')||''),p_items:items});if(error)throw error;saveCart([]);render();show('<div class="panelhead"><h2>Order received</h2><button class="x" onclick="closeModal()">×</button></div><div class="empty"><b>Thank you for choosing BRIM.</b><br><br>Your order has been sent successfully.<br>We will contact you to confirm the details.</div><button class="full" onclick="closeModal()">CONTINUE SHOPPING</button>')}catch(err){console.error(err);alert(err.message||'Could not submit your order. Please try again or contact BRIM.');btn.disabled=false;btn.textContent='CONFIRM ORDER'}}
function openAdmin(){show(`<div class="panelhead"><h2>Admin login</h2><button class="x" onclick="closeModal()">×</button></div><p class="subtle">Sign in with your BRIM admin email and Supabase password.</p><form onsubmit="login(event)"><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="username" placeholder="Admin email"></div><div class="field"><label>Password</label><input name="pass" type="password" required autocomplete="current-password" placeholder="Your password"></div><button class="full">SIGN IN</button></form>`)}
async function login(e){e.preventDefault();let form=e.target,btn=form.querySelector('button.full');btn.disabled=true;btn.textContent='SIGNING IN...';try{let f=new FormData(form);const {data,error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('pass')});if(error)throw error;const {data:membership,error:checkError}=await sb.from('admin_users').select('user_id').eq('user_id',data.user.id).maybeSingle();if(checkError||!membership){await sb.auth.signOut();throw new Error('This account does not have BRIM admin access.')}currentUser=data.user;await dashboard('products')}catch(err){alert(err.message||'Login failed. Check your email and password.');btn.disabled=false;btn.textContent='SIGN IN'}}
async function ensureAdmin(){const {data:{user}}=await sb.auth.getUser();if(!user){openAdmin();return false}const {data,error}=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){await sb.auth.signOut();openAdmin();return false}currentUser=user;return true}
async function dashboard(tab){if(!currentUser&&!await ensureAdmin())return;let ps=products(),ordersHtml='';if(tab==='orders'){const {data,error}=await sb.from('orders').select('id,customer_name,phone,address,notes,status,total,created_at,order_items(product_name,unit_price,quantity,customization)').order('created_at',{ascending:false});if(error){alert(error.message);return}ordersHtml=(data||[]).map(o=>'<div class="orderline"><div><b>'+esc(o.customer_name)+'</b><div class="subtle">'+esc(o.phone)+' · '+esc(o.address)+'</div>'+(o.notes?'<div class="subtle">Governorate: '+esc(o.notes)+'</div>':'')+(o.order_items||[]).map(i=>'<div class="subtle"><b>'+esc(i.product_name)+'</b> × '+i.quantity+' ('+money(i.unit_price)+')'+(i.customization?.custom?'<br>Method: '+esc(i.customization.print_method)+' · Cap style: '+esc(capLabel(i.customization.cap_type))+(i.customization.custom_text?'<br>Lettering: '+esc(i.customization.custom_text)+' · Font: '+esc(i.customization.font)+'<div><img class="admin-preview" src="data:image/svg+xml;charset=utf-8,'+encodeURIComponent(letteringSvg(i.customization.custom_text,i.customization.font))+'"><button class="mini" onclick="downloadLettering(\''+o.id+'\',\''+esc(i.customization.custom_text).replace(/'/g,"\\'")+'\',\''+esc(i.customization.font)+'\')">DOWNLOAD LETTERING</button></div>':'')+'</div>').join('')+'<div class="subtle">'+new Date(o.created_at).toLocaleString()+' · '+esc(o.status)+'</div></div><b>'+money(o.total)+'</b></div>').join('')||'<div class="empty">No orders yet.</div>'}
show('<div class="panelhead"><h2>BRIM / Dashboard</h2><button class="x" onclick="closeModal()">×</button></div><div class="tabs"><button class="'+(tab==='products'?'active':'')+'" onclick="dashboard(\'products\')">Products</button><button class="'+(tab==='orders'?'active':'')+'" onclick="dashboard(\'orders\')">Orders</button><button onclick="adminLogout()">LOG OUT</button></div>'+(tab==='products'?'<button class="full" onclick="productForm()">+ ADD NEW PRODUCT</button>'+ps.map(p=>'<div class="adminrow"><img src="'+esc(p.image_url||'')+'" onerror="this.style.visibility=\'hidden\'"><div><b>'+esc(p.name)+'</b><div class="subtle">'+money(p.price)+' · '+(p.product_group||'Unassigned')+' · '+(p.cap_type||'No style')+' · '+(p.active?'Active':'Hidden')+'</div></div><button class="mini" onclick="productForm(\''+p.id+'\')">EDIT</button></div>').join(''):'')+ (tab==='orders'?ordersHtml:'') ,true)}
function productForm(id){const p=id?products().find(x=>x.id===id):null;show('<div class="panelhead"><h2>'+(p?'Edit product':'Add a product')+'</h2><button class="x" onclick="dashboard(\'products\')">×</button></div><form onsubmit="addProduct(event,'+(p?("'"+p.id+"'"):'null')+')"><div class="field"><label>Product name</label><input name="name" required value="'+esc(p?.name||'')+'" placeholder="e.g. Docker Cap"></div><div class="field"><label>Description (optional)</label><textarea name="description" placeholder="Short product details">'+esc(p?.description||'')+'</textarea></div><div class="field"><label>Price (EGP)</label><input name="price" type="number" min="1" step="0.01" required value="'+(p?.price||'')+'" placeholder="450"></div><div class="field"><label>Main category</label><select name="product_group" required style="width:100%;padding:12px;border:1px solid #ddd"><option value="">Choose category</option><option value="designed" '+(p?.product_group==='designed'?'selected':'')+'>Designed Caps</option><option value="plain" '+(p?.product_group==='plain'?'selected':'')+'>Plain Caps</option></select></div><div class="field"><label>Cap style</label><select name="cap_type" required style="width:100%;padding:12px;border:1px solid #ddd"><option value="">Choose style</option>'+CAP_TYPES.map(t=>'<option value="'+t+'" '+(p?.cap_type===t?'selected':'')+'>'+capLabel(t)+'</option>').join('')+'</select></div><div class="field"><label>Product photo '+(p?'(optional — leave empty to keep current photo)':'')+'</label><input name="photo" type="file" accept="image/*" '+(p?'':'required')+' onchange="previewProductPhoto(event)"><div class="uploadhint">Choose a photo directly from your gallery or computer.</div><img id="productPreview" class="previewimg" src="'+(p?.image_url||'')+'" style="'+(p?.image_url?'display:block':'')+'" alt="Product preview"></div><button class="full">'+(p?'UPDATE PRODUCT':'SAVE PRODUCT')+'</button></form>',true)}
function previewProductPhoto(e){const file=e.target.files&&e.target.files[0],img=document.getElementById('productPreview');if(!file||!img)return;if(!file.type.startsWith('image/')){alert('Please choose an image file.');e.target.value='';return}const reader=new FileReader();reader.onload=()=>{img.src=reader.result;img.style.display='block'};reader.readAsDataURL(file)}
async function compressImage(file){const bitmap=await createImageBitmap(file);const max=1400,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);return await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.84))}
async function addProduct(e,id=null){e.preventDefault();const form=e.target,btn=form.querySelector('button.full');btn.disabled=true;btn.textContent='SAVING...';let uploadedPath=null;try{let f=new FormData(form),updates={name:f.get('name').trim(),description:(f.get('description')||'').trim(),price:Number(f.get('price')),product_group:f.get('product_group'),cap_type:f.get('cap_type')};const file=f.get('photo');if(file&&file.size){let blob=await compressImage(file),path=crypto.randomUUID()+'.jpg';const {error:uploadError}=await sb.storage.from('product-images').upload(path,blob,{contentType:'image/jpeg',upsert:false});if(uploadError)throw uploadError;uploadedPath=path;updates.image_url=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl}let result=id?await sb.from('products').update(updates).eq('id',id):await sb.from('products').insert({...updates,active:true});if(result.error)throw result.error;await loadProducts();await dashboard('products')}catch(err){console.error(err);if(uploadedPath)await sb.storage.from('product-images').remove([uploadedPath]);alert(err.message||'Could not save product.');btn.disabled=false;btn.textContent=id?'UPDATE PRODUCT':'SAVE PRODUCT'}}
async function deleteProduct(id){if(!confirm('Hide this product from the shop?'))return;const {error}=await sb.from('products').update({active:false}).eq('id',id);if(error){alert(error.message);return}await loadProducts();await dashboard('products')}
async function adminLogout(){await sb.auth.signOut();currentUser=null;openAdmin()}
async function init(){await loadProducts();const {data:{user}}=await sb.auth.getUser();if(user){const {data}=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(data)currentUser=user;else await sb.auth.signOut()}}
init();

</script></body></html>
